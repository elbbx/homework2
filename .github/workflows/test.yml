name: Workflow tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow behavior tests (no API key needed)
        working-directory: code
        run: npm test
      - name: Verify generated Python example
        working-directory: code/test-results
        run: python3 -m unittest -v test_summarize
